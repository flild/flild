<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Flild / Backend Developer</title>
  <desc id="desc">C#/.NET and Python. APIs, background jobs, integrations, and data workflows. A diagram connects an API to workers and data storage.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0F4FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="56" y1="0" x2="1144" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46C4"/>
      <stop offset="1" stop-color="#087F98"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#4F46C4" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="url(#background)" stroke="#D6DFEE"/>
  <rect x="700" y="24" width="468" height="288" rx="16" fill="url(#grid)"/>
  <path d="M56 1H1144" stroke="url(#accent)" stroke-width="2"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="62" cy="49" r="5" fill="#087F98"/>
    <text x="80" y="54" fill="#4F46C4" font-size="12" font-weight="600" letter-spacing="2.4">BACKEND DEVELOPER</text>
    <text x="56" y="146" fill="#14213D" font-size="76" font-weight="700" letter-spacing="-3">Flild<tspan fill="#087F98">.</tspan></text>
    <text x="59" y="189" fill="#334665" font-size="26" font-weight="500">C# / .NET <tspan fill="#8A97AD"> + </tspan> Python</text>
    <text x="59" y="229" fill="#536580" font-size="17">APIs, background jobs, integrations,</text>
    <text x="59" y="254" fill="#536580" font-size="17">and data workflows.</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="12">
      <rect x="59" y="280" width="87" height="28" rx="7" fill="#EAF0FD" stroke="#C7D3EA"/>
      <text x="102.5" y="299" text-anchor="middle" fill="#484498">REST APIs</text>
      <rect x="156" y="280" width="80" height="28" rx="7" fill="#EAF0FD" stroke="#C7D3EA"/>
      <text x="196" y="299" text-anchor="middle" fill="#484498">Workers</text>
      <rect x="246" y="280" width="72" height="28" rx="7" fill="#EAF0FD" stroke="#C7D3EA"/>
      <text x="282" y="299" text-anchor="middle" fill="#484498">Data</text>
    </g>

    <text x="754" y="64" fill="#64748B" font-size="11" font-weight="600" letter-spacing="2">FROM REQUEST TO RESULT</text>
    <g stroke="#889BC3" stroke-width="1.5">
      <path d="M839 170H879V133H923"/>
      <path d="M879 170V237H923"/>
    </g>
    <circle cx="879" cy="170" r="4" fill="#087F98"/>
    <path d="M918 129L923 133L918 137M918 233L923 237L918 241" stroke="#087F98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="735" y="126" width="104" height="88" rx="12" fill="#EEF1FF" stroke="#A5AFE0"/>
    <path d="M775 146L768 153L775 160M799 146L806 153L799 160M791 144L783 162" stroke="#4F46C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="787" y="191" text-anchor="middle" fill="#34396A" font-size="16" font-weight="600">API</text>

    <rect x="923" y="94" width="192" height="78" rx="12" fill="#ECF9FB" stroke="#9ACAD3"/>
    <circle cx="947" cy="120" r="4" fill="#087F98"/>
    <text x="962" y="125" fill="#155769" font-size="15" font-weight="600">Workers</text>
    <text x="943" y="150" fill="#476A79" font-size="12">Jobs &amp; integrations</text>

    <rect x="923" y="198" width="192" height="78" rx="12" fill="#F2EFFF" stroke="#C2B8E2"/>
    <ellipse cx="947" cy="221" rx="7" ry="3" stroke="#7760BA" stroke-width="1.5"/>
    <path d="M940 221V229C940 233 954 233 954 229V221" stroke="#7760BA" stroke-width="1.5"/>
    <text x="962" y="229" fill="#51417D" font-size="15" font-weight="600">Data</text>
    <text x="943" y="254" fill="#6B6083" font-size="12">Storage &amp; workflows</text>
