<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Flild / Backend Developer</title>
  <desc id="desc">C#/.NET and Python. APIs, background jobs, integrations, and data workflows. A diagram connects an API to workers and data storage.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101A2C"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="56" y1="0" x2="1144" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#A5B4FC" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="url(#background)" stroke="#293449"/>
  <rect x="700" y="24" width="468" height="288" rx="16" fill="url(#grid)"/>
  <path d="M56 1H1144" stroke="url(#accent)" stroke-width="2"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="62" cy="49" r="5" fill="#67E8F9"/>
    <text x="80" y="54" fill="#A5B4FC" font-size="12" font-weight="600" letter-spacing="2.4">BACKEND DEVELOPER</text>
    <text x="56" y="146" fill="#F0F6FC" font-size="76" font-weight="700" letter-spacing="-3">Flild<tspan fill="#67E8F9">.</tspan></text>
    <text x="59" y="189" fill="#C5D0E3" font-size="26" font-weight="500">C# / .NET <tspan fill="#65738C"> + </tspan> Python</text>
    <text x="59" y="229" fill="#93A4BE" font-size="17">APIs, background jobs, integrations,</text>
    <text x="59" y="254" fill="#93A4BE" font-size="17">and data workflows.</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="12">
      <rect x="59" y="280" width="87" height="28" rx="7" fill="#17243A" stroke="#31435F"/>
      <text x="102.5" y="299" text-anchor="middle" fill="#B8C6FC">REST APIs</text>
      <rect x="156" y="280" width="80" height="28" rx="7" fill="#17243A" stroke="#31435F"/>
      <text x="196" y="299" text-anchor="middle" fill="#B8C6FC">Workers</text>
      <rect x="246" y="280" width="72" height="28" rx="7" fill="#17243A" stroke="#31435F"/>
      <text x="282" y="299" text-anchor="middle" fill="#B8C6FC">Data</text>
    </g>

    <text x="754" y="64" fill="#71839F" font-size="11" font-weight="600" letter-spacing="2">FROM REQUEST TO RESULT</text>
    <g stroke="#506B96" stroke-width="1.5">
      <path d="M839 170H879V133H923"/>
      <path d="M879 170V237H923"/>
    </g>
    <circle cx="879" cy="170" r="4" fill="#67E8F9"/>
    <path d="M918 129L923 133L918 137M918 233L923 237L918 241" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="735" y="126" width="104" height="88" rx="12" fill="#152238" stroke="#5269A4"/>
    <path d="M775 146L768 153L775 160M799 146L806 153L799 160M791 144L783 162" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="787" y="191" text-anchor="middle" fill="#E1E9F8" font-size="16" font-weight="600">API</text>

    <rect x="923" y="94" width="192" height="78" rx="12" fill="#12242D" stroke="#315F70"/>
    <circle cx="947" cy="120" r="4" fill="#67E8F9"/>
    <text x="962" y="125" fill="#D0F5FA" font-size="15" font-weight="600">Workers</text>
    <text x="943" y="150" fill="#86ABB8" font-size="12">Jobs &amp; integrations</text>

    <rect x="923" y="198" width="192" height="78" rx="12" fill="#1C2036" stroke="#4F507B"/>
    <ellipse cx="947" cy="221" rx="7" ry="3" stroke="#B9AFF5" stroke-width="1.5"/>
    <path d="M940 221V229C940 233 954 233 954 229V221" stroke="#B9AFF5" stroke-width="1.5"/>
    <text x="962" y="229" fill="#E0DCFA" font-size="15" font-weight="600">Data</text>
    <text x="943" y="254" fill="#A09ABB" font-size="12">Storage &amp; workflows</text>
