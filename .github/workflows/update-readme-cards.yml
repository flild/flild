name: Update profile assets

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/update-readme-cards.yml'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Create output directory
        run: mkdir -p profile

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true&include_all_commits=true&rank_icon=github'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          if git diff --cached --quiet; then
            echo "Profile assets are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile assets"
          git push
